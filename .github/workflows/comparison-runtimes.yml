name: Comparison runtime evidence
on:
  push:
    branches: [research/competitor-runtime-verification]
    paths:
      - .github/workflows/comparison-runtimes.yml
      - comparison/research/runtime-gap-review-2026-10-19/run-bend.py
      - comparison/research/bend-contract-review-2026-10-20/**
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned releases
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/runtime-evidence" "$RUNNER_TEMP/bend"
          curl -fL https://github.com/bendlang/bend/releases/download/v2.0.37/bend-2.0.37-linux-x64.tar.gz -o "$RUNNER_TEMP/bend.tgz"
          sha256sum "$RUNNER_TEMP/bend.tgz" | tee "$RUNNER_TEMP/runtime-evidence/bend-archive.sha256"
          echo "84c32465a39bc9ac315eade23f470cb8db03153dc860f89564fcfec153c3e445  $RUNNER_TEMP/bend.tgz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/bend.tgz" -C "$RUNNER_TEMP/bend"
          echo "$RUNNER_TEMP/bend/bend/bin" >> "$GITHUB_PATH"
          echo "BEND_HOME=$RUNNER_TEMP/bend/bend" >> "$GITHUB_ENV"
          curl -fL https://github.com/leanprover/lean4/releases/download/v4.34.0/lean-4.34.0-linux.tar.zst -o "$RUNNER_TEMP/lean.tar.zst"
          sha256sum "$RUNNER_TEMP/lean.tar.zst" | tee "$RUNNER_TEMP/runtime-evidence/lean-archive.sha256"
          echo "caaa98356098c85dc0fcbbd28e1ec66f39eb6551829972b752ff20e1286b646b  $RUNNER_TEMP/lean.tar.zst" | sha256sum --check
          tar --zstd -xf "$RUNNER_TEMP/lean.tar.zst" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/lean-4.34.0-linux/bin" >> "$GITHUB_PATH"
      - name: Exercise proof kernel and execution targets
        env:
          BEND_NO_TELEMETRY: '1'
          CC: /usr/bin/clang
          EVIDENCE_DIR: ${{ runner.temp }}/runtime-evidence
        run: python3 comparison/research/runtime-gap-review-2026-10-19/run-bend.py
      - name: Exercise Bend proof and host boundary contracts
        env:
          BEND_NO_TELEMETRY: '1'
          CC: /usr/bin/clang
        run: python3 comparison/research/bend-contract-review-2026-10-20/reproduce.py --output "$RUNNER_TEMP/runtime-evidence/bend-deep" --kernel
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bend-runtime-evidence
          path: ${{ runner.temp }}/runtime-evidence
