name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install image tooling
        run: npm ci

      - name: Run Node.js tests
        run: npm test

      - name: Install reviewed Kujo release
        uses: kujolang/kujo/.github/actions/setup-kujo@a91702682e2969a66938b561b8059034ab2bc717
        with:
          version: v1.8.0

      - name: Build and verify site
        shell: bash
        run: |
          kujo --version
          kujo run ./build.kujo -- --site-url https://kujolang.ai
          npm run images:responsive
          cp CNAME output/CNAME
          touch output/.nojekyll
          bash scripts/verify-site-contract.sh output
          bash scripts/validate-generated-output.sh output
          node --check output/assets/js/site.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: output

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
