name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  KUJO_REF: 7df293865ae7d342b669789d011f607449808b02

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install image tooling
        run: npm ci

      - name: Run Node.js tests
        run: npm test

      - name: Restore Kujo build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ runner.temp }}/kujo/target
          key: kujo-${{ runner.os }}-${{ env.KUJO_REF }}

      - name: Build pinned Kujo runtime
        shell: bash
        run: |
          git init "$RUNNER_TEMP/kujo"
          git -C "$RUNNER_TEMP/kujo" remote add origin https://github.com/kujolang/kujo.git
          git -C "$RUNNER_TEMP/kujo" fetch --depth 1 origin "$KUJO_REF"
          git -C "$RUNNER_TEMP/kujo" checkout --detach "$KUJO_REF"
          cargo build --release --locked --manifest-path "$RUNNER_TEMP/kujo/Cargo.toml"
          mkdir -p "$RUNNER_TEMP/bin"
          cp "$RUNNER_TEMP/kujo/target/release/kujo" "$RUNNER_TEMP/bin/kujo"
          chmod 755 "$RUNNER_TEMP/bin/kujo"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Build and verify site
        shell: bash
        run: |
          kujo --version
          kujo run ./build.kujo -- --site-url https://kujolang.ai
          npm run images:responsive
          cp CNAME output/CNAME
          touch output/.nojekyll
          bash scripts/verify-site-contract.sh output
          bash scripts/validate-generated-output.sh output
          node --check output/assets/js/site.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: output

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
