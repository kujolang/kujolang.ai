<main class="ecosystem-detail" id="main-content">
	<header class="sk-hero tool-hero" data-layout="split">
		<div class="sk-hero__inner">
			<div class="tool-hero__copy"><p class="sk-badge" data-variant="outline">{{section}}</p><h1>{{title}}</h1><p class="tool-hero__lead">{{description}}</p><p class="tool-hero__story">{{launch_story}}</p></div>
			<div class="tool-install-panel">
				<p class="eyebrow">Get the source</p>
				<figure class="sk-code-block"><figcaption><span>Terminal</span><button type="button" data-copy-code>Copy</button></figcaption><pre><code>{{install_command}}</code></pre></figure>
				<p class="tool-scope-note">{{scope_note}}</p>
			</div>
		</div>
	</header>
	<section class="tool-body section-shell">
		<article class="prose-shell kujo-content">{{body}}</article>
		<aside class="sk-card tool-links" aria-labelledby="tool-links-title"><h2 id="tool-links-title">Continue exploring</h2><p>Read the repository for setup, contracts, current status, safety boundaries, and verification commands.</p><div class="sk-card__actions"><a class="sk-button" href="{{github_url}}">View on GitHub</a><a class="sk-button" data-variant="secondary" href="/ecosystem/">Back to ecosystem</a></div></aside>
	</section>
</main>
