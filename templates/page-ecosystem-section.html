<main class="content-page ecosystem-index ecosystem-section-index" id="main-content">
	<header class="page-hero sk-hero" data-layout="split">
		<div class="page-hero__media" aria-hidden="true"><img src="{{hero}}" alt="" class="featured-image" width="1916" height="821" loading="eager" decoding="async" fetchpriority="high"></div>
		<div class="page-hero__wash" aria-hidden="true"></div>
		<div class="sk-hero__inner"><div class="page-hero__copy"><p class="sk-badge" data-variant="outline">{{eyebrow}}</p><h1>{{title}}</h1><p>{{intro}}</p><div class="sk-hero__actions"><a class="sk-button" data-variant="secondary" href="/ecosystem/">Ecosystem overview</a></div></div></div>
	</header>
	<section class="ecosystem-section section-shell" aria-labelledby="ecosystem-section-catalog-title">
		<div class="section-heading sk-heading"><h2 id="ecosystem-section-catalog-title">{{catalog_title}}</h2><span>{{catalog_description}}</span></div>
		<ul class="card-grid ecosystem-card-grid">{{cards}}</ul>
	</section>
</main>
