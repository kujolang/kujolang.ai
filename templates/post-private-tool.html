<main class="ecosystem-detail" id="main-content">
	<header class="sk-hero tool-hero" data-layout="split">
		<div class="tool-hero__media" aria-hidden="true">{{featured_image_html}}</div>
		<div class="tool-hero__wash" aria-hidden="true"></div>
		<div class="sk-hero__inner">
			<div class="tool-hero__copy"><p class="sk-badge" data-variant="outline">{{section}}</p><h1>{{title}}</h1><p class="tool-hero__lead">{{description}}</p><p class="tool-hero__story">{{launch_story}}</p></div>
			<div class="tool-install-panel">
				<p class="eyebrow">Source access</p><p>This repository is private. Public installation is not available.</p>
				<p class="tool-scope-note">{{scope_note}}</p>
			</div>
		</div>
	</header>
	<section class="tool-body section-shell">
		<article class="prose-shell kujo-content">{{body}}</article>
		<aside class="sk-card tool-links" aria-labelledby="tool-links-title"><h2 id="tool-links-title">Source and catalog</h2><p>Source access is restricted. Browse the catalog for related tools.</p><div class="sk-card__actions"><a class="sk-button" data-variant="secondary" href="{{catalog_url}}">{{catalog_label}}</a></div></aside>
	</section>
</main>
