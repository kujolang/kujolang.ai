<main class="content-page ethos-page" id="main-content">
	<header class="page-hero sk-hero" data-layout="split">
		<div class="page-hero__media" aria-hidden="true">{{featured_image_html}}</div>
		<div class="page-hero__wash" aria-hidden="true"></div>
		<div class="sk-hero__inner"><div class="page-hero__copy"><h1>{{title}}</h1><p>{{description}}</p></div></div>
	</header>
	<div class="longform-layout">
		<aside class="sk-metadata-panel ethos-aside" aria-label="Ethos summary">
			<h2>Working principles</h2>
			<dl><div><dt>Clarity</dt><dd>Make behavior legible.</dd></div><div><dt>Context</dt><dd>Keep evidence close.</dd></div><div><dt>Control</dt><dd>Keep authority explicit.</dd></div></dl>
		</aside>
		<article class="prose-shell kujo-content">{{body}}</article>
	</div>
</main>
