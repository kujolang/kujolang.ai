objective: "Publish the eight Kujo Workflows 0.3.0 Publishing House routes with verified content, dither heroes, Howl social cards, accurate catalog counts, and search-ready generated output."
checklist_file: ""
max_iterations: 4
max_no_progress: 2
max_consecutive_failures: 3

allowed_actions:
  - read_files
  - edit_files
  - run_tests
  - commit_local_changes
  - add_project_assets
  - convert_project_assets
  - deploy

blocked_actions:
  - destructive_cleanup
  - production_config_change

eval_gates:
  - id: shell_syntax
    command: "bash -n scripts/dev.sh scripts/render-social-cards.sh scripts/validate-generated-output.sh scripts/verify-site-contract.sh"
    required: true

  - id: howl_manifest
    command: "/Users/robertdevore/2026/Kujolang/kujo-repos/howl/bin/howl validate --manifest howl-social.json"
    required: true

  - id: ssg_build_receipt
    command: "test -s output/sitemap.xml && test -s output/ecosystem/workflows/publishing-house-post-publication/index.html"
    required: true

  - id: generated_output
    command: "bash scripts/validate-generated-output.sh output"
    required: true

  - id: site_contract
    command: "bash scripts/verify-site-contract.sh output"
    required: true

  - id: social_contract
    command: "npm run social:verify"
    required: true

  - id: publishing_house_counts
    command: "test $(find content/workflows -maxdepth 1 -type f -name \*.md | wc -l) -eq 34 && test $(find assets/images/social -maxdepth 1 -type f -name \*.jpg | wc -l) -eq 173"
    required: true

  - id: diff_check
    command: "git diff --check -- .loop-engineering/loop.yml CHANGELOG.md README.md build.kujo howl-social.json scripts templates content assets seo-audit"
    required: true

commit:
  enabled: true
  strategy: small_meaningful
  push: true

memory:
  enabled: true
  provider: strata
  project: "Agent Notes"
  mode: consolidate
  retrieval_tests: true
