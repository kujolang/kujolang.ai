objective: "Verify authorized GitHub Pages publication and every new language route"
max_iterations: 1
max_no_progress: 1
max_consecutive_failures: 1
eval_gates:
  - id: production
    command: "python3 scripts/verify-production-language.py"
    required: true
  - id: review_whitespace
    command: "git diff 5e10ff9 --check"
    required: true
commit:
  enabled: false
  push: false
