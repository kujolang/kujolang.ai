# Spec — Kujolang.ai launch-site refinement

name: "Refine Kujolang.ai launch website"
goal: "Apply the approved Kujo naming, navigation, hero imagery, install modal, footer, ecosystem inventory, and responsive layout updates to the Kujo SSG website."
version: "0.1.0"
background: "The initial Kujo SSG/SiteKit site established the page architecture. This task aligns the launch experience with the approved copy, attached monochrome dither imagery, and the verified 30-repository ecosystem inventory."
scope: "Home, Ethos, Contact, Writing, Ecosystem, all ecosystem detail pages, shared header/footer, attached image processing, Quick Install behavior, and deterministic local verification."
non_goals:
  - "Deploying or hosting the site"
  - "Changing Kujo language, SSG, or SiteKit upstream repositories"
  - "Writing final replacement editorial copy for the Ethos or Writing sections"
relevant_systems:
  - "Kujo SSG"
  - "Kujo SiteKit"
  - "Kujo Spec"
  - "Kujo RunLedger"
  - "Kujo Loop Engineering"
likely_files:
  - "templates/layout.html"
  - "templates/page-home.html"
  - "templates/page-ethos.html"
  - "templates/page-contact.html"
  - "templates/page-writing.html"
  - "templates/page-ecosystem.html"
  - "templates/ecosystem.html"
  - "assets/css/style.css"
  - "assets/js/site.js"
  - "assets/images/**/*.webp"
  - "content/ecosystem/*.md"
  - "build.kujo"
acceptance_criteria:
  - "All product-name copy uses Kujo rather than KUJO or K-U-J-O, except case-sensitive code or URLs that require otherwise"
  - "The sticky translucent header shows the Kujo logo and wordmark, ordered navigation Home/Ecosystem/Ethos/Writing/Contact, and a Quick Install modal trigger"
  - "Quick Install exposes a one-line install command with an in-field copy control and accessible modal behavior"
  - "The home page contains only the shared header and a full-viewport hero headed Trust at the speed of AI at 96px on desktop"
  - "The home hero uses the approved static right-aligned image with no wave animation and links to the docs and ecosystem"
  - "Ethos, Contact, Writing, Ecosystem, and ecosystem detail heroes use static WebP dither imagery instead of the square pattern"
  - "Writing cards align their actions at the bottom and the section heading is not artificially width-constrained"
  - "Ecosystem content is grouped into Primitives, Tooling, and Showcases using only the verified repository inventory"
  - "Every ecosystem detail page uses the common image hero, View ecosystem label, and an accessible icon copy control that signals success"
  - "The footer matches the supplied local reference structure with Kujo and navigation on the left and X/GitHub/Discord icons on the right"
  - "All supplied raster assets used by the project are converted to descriptive WebP filenames"
  - "The Kujo SSG build, generated-output validation, site contract checks, and local HTTP route probes pass"
risks:
  - "The attached files lost their original semantic filenames, requiring visual mapping to ecosystem subjects"
  - "The verified ecosystem list may require removing previously generated routes and navigation references"
  - "Large imagery could regress page weight unless WebP conversion is effective"
dependencies:
  - "Kujo runtime 1.0.0"
  - "Local Kujo SSG build.kujo"
  - "Attached 29-image monochrome dither asset set"
  - "Verified launch-evidence repository inventory"
review_expectations:
  - "Review the site through Kujo's local HTTP server at desktop and mobile widths"
  - "Confirm copy, links, modal keyboard behavior, image placement, and ecosystem grouping"
human_approval_points:
  - "Visual and editorial approval after the local site is available"
estimated_effort: "1 focused engineering session"
priority: "high"
tags:
  - "kujolang-ai"
  - "site"
  - "launch"
  - "kujo-ssg"
  - "sitekit"
