-cap-55" class="clip subtitle" data-start="23.390" data-duration="4.320"><span>and backups to preserve the local history. Watchdog makes AI activity</span></div><div id="chapter-14-finish-cap-66" class="clip subtitle" data-start="27.990" data-duration="5.160"><span>inspectable without taking over execution or recovery. Start with one application</span></div><div id="chapter-14-finish-cap-77" class="clip subtitle" data-start="33.230" data-duration="2.960"><span>and one question you want to answer. The setup guide and</span></div><div id="chapter-14-finish-cap-88" class="clip subtitle" data-start="36.270" data-duration="5.360"><span>source are available at kujolang dot ai, slash ecosystem, slash watchdog.</span></div><div class="foot"><span>ISOLATED DEMO · SYNTHETIC DATA</span><span>KUJO</span></div></div><script>const tl=gsap.timeline({paused:true});tl.fromTo("#chapter-14-finish-step-0",{opacity:1},{opacity:1,duration:.6,ease:"power3.out"},0);tl.fromTo("#chapter-14-finish-step-1",{opacity:1},{opacity:1,duration:.6,ease:"power3.out"},3);tl.fromTo("#chapter-14-finish-step-2",{opacity:1},{opacity:1,duration:.6,ease:"power3.out"},6);tl.fromTo("#chapter-14-finish-note-0 span",{opacity:0},{opacity:1,duration:.3},0.000);tl.fromTo("#chapter-14-finish-note-1 span",{opacity:0},{opacity:1,duration:.3},14.167);tl.fromTo("#chapter-14-finish-note-2 span",{opacity:0},{opacity:1,duration:.3},28.333);window.__timelines['chapter-14-finish']=tl;</script></template>
