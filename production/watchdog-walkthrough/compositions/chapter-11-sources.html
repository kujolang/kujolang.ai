itle" data-start="26.270" data-duration="4.400"><span>evidence, not a remote health check. The Add connection flow provides</span></div><div id="chapter-11-sources-cap-66" class="clip subtitle" data-start="30.830" data-duration="4.400"><span>setup guidance and registration options. Named proxy profiles can be managed</span></div><div id="chapter-11-sources-cap-77" class="clip subtitle" data-start="35.310" data-duration="4.320"><span>here without placing raw credentials into the dashboard. Keep credential values</span></div><div id="chapter-11-sources-cap-88" class="clip subtitle" data-start="39.670" data-duration="2.520"><span>in the appropriate environment or secret store.</span></div><div class="foot"><span>ISOLATED DEMO · SYNTHETIC DATA</span><span>KUJO</span></div></div><script>const tl=gsap.timeline({paused:true});tl.set("#chapter-11-sources-camera",{scale:1,x:0,y:0,transformOrigin:"0 0"},0);tl.to("#chapter-11-sources-camera",{scale:1.15,x:-100,y:-90,duration:.8,ease:"power2.inOut"},10.767);tl.to("#chapter-11-sources-camera",{scale:1.08,x:-60,y:-190,duration:.8,ease:"power2.inOut"},21.533);tl.to("#chapter-11-sources-camera",{scale:1,x:0,y:0,duration:.8,ease:"power2.inOut"},32.300);tl.fromTo("#chapter-11-sources-note-0 span",{opacity:0},{opacity:1,duration:.3},0.000);tl.fromTo("#chapter-11-sources-note-1 span",{opacity:0},{opacity:1,duration:.3},14.356);tl.fromTo("#chapter-11-sources-note-2 span",{opacity:0},{opacity:1,duration:.3},28.711);window.__timelines['chapter-11-sources']=tl;</script></template>
